name: Apply tuition migrations
on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y postgresql-client >/dev/null
      - env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          DB_URL="postgresql://postgres.pgiytpbrnyxnnfupvaiv:${SUPABASE_DB_PASSWORD}@aws-0-eu-central-1.pooler.supabase.com:5432/postgres"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/030_tuition_programme_subject_fk.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/031_tuition_publish_lesson_status.sql
          # Adds profiles.is_platform_admin and redefines is_super_admin() to
          # accept it alongside the legacy per-school super_admin membership.
          # Idempotent — safe to re-run.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/032_platform_admin.sql