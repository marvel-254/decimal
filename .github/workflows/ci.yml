name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint || true
      - run: npx tsc --noEmit
      # The test suite gates merges. It previously never ran in CI, which is how
      # the RBAC, payments, messaging and sync RLS defects below reached
      # production with a green build.
      - run: npm test
      - run: npm run build
      - name: Verify build output
        run: |
          test -f .next/BUILD_ID || { echo "Next.js build missing BUILD_ID"; exit 1; }
          test -d .next/static || { echo "Next.js build missing static chunks"; exit 1; }
      - name: Audit dependencies
        run: npm audit --production 2>&1 | tee audit.log || true

  deploy:
    needs: lint-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest --prod --yes

  build-desktop-linux:
    needs: lint-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - name: Build Tauri Linux
        run: npx tauri build
      - name: Rename artifacts
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF#refs/tags/}"
          find src-tauri/target/release/bundle -name "*.deb" -exec cp {} dist/decimal-${VERSION}-linux-x86_64.deb \;
          find src-tauri/target/release/bundle -name "*.AppImage" -exec cp {} dist/decimal-${VERSION}-linux-x86_64.AppImage \;
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/*
          retention-days: 5

  build-desktop-windows:
    needs: lint-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: npm ci
      - run: npm run build
      - name: Build Tauri Windows
        run: npx tauri build
      - name: Rename artifacts
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF#refs/tags/}"
          find src-tauri/target/release/bundle -name "*.exe" -exec cp {} dist/decimal-${VERSION}-windows-x64.exe \; 2>/dev/null || true
          find src-tauri/target/release/bundle -name "*.msi" -exec cp {} dist/decimal-${VERSION}-windows-x64.msi \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/*
          retention-days: 5

  build-android:
    needs: lint-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/decimal-release.jks
            echo "Keystore decoded, size: $(wc -c < /tmp/decimal-release.jks) bytes"
          else
            echo "No keystore secret found, skipping signing"
          fi
      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f /tmp/decimal-release.jks ]; then
            echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=/tmp/decimal-release.jks" >> android/key.properties
            echo "key.properties created"
          else
            echo "No keystore found, skipping key.properties"
          fi
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease
      - name: Verify release APK is signed
        if: always()
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" -type f | head -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk || { echo "Release APK is not signed!"; exit 1; }
          else
            echo "apksigner not found, skipping verification"
          fi
      - name: Rename artifacts
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF#refs/tags/}"
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/decimal-${VERSION}-android-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/decimal-${VERSION}-android-release.apk 2>/dev/null || cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/decimal-${VERSION}-android-release.apk 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          retention-days: 5

  create-release:
    needs: [build-desktop-linux, build-desktop-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: find artifacts -type f | head -20
      - name: Create checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.exe" -o -name "*.msi" -o -name "*.apk" \) -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: artifacts/*
